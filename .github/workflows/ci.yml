name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync dependencies
        run: uv sync

      - name: Build boucle.mojopkg
        run: uv run -- bash scripts/build.sh

      - name: Run tests
        run: uv run -- bash scripts/run_tests.sh
